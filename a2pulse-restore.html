window.doRestore = async function() {
  const btn = document.getElementById('restoreBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.className = 'status loading';
  status.textContent = 'Authenticating...';

  try {
    await signInWithEmailAndPassword(auth, 'adrian.antonini.leadership@gmail.com', prompt('Enter your Firebase password:'));
    status.textContent = 'Authenticated. Writing clean data to Firestore...';
    
    await setDoc(doc(db, 'gulliver-events', 'data'), {
      events: CLEAN_EVENTS,
      deadlines: [],
      vendors: [],
      sponsors: [],
      readiness: {},
      checklist: {},
      prefs: {},
      lastUpdated: new Date().toISOString()
    });
    
    status.className = 'status ok';
    status.textContent = 'SUCCESS — ' + CLEAN_EVENTS.length + ' clean events restored to Firestore. You can now close this page and reload the Command Center.';
    btn.textContent = 'Done';
  } catch(err) {
    status.className = 'status err';
    status.textContent = 'Error: ' + err.message;
    btn.disabled = false;
  }
};
